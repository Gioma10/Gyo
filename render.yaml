services:
  - type: web
    name: gyo-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: pnpm install && pnpm build && pnpm prisma migrate deploy
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
